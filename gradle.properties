org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- 앱 식별 정보: 이 파일 한 곳에서만 정의하고 나머지는 참조한다 ----
# gradle.properties는 ISO-8859-1로 읽히므로 한글 값은 유니코드 이스케이프로 적는다.
# app.displayName = 같이가숲
app.displayName=\uAC19\uC774\uAC00\uC232
app.nameEn=GoTogetherForest
app.teamName=DriveXFamily
app.applicationId=app.familyjourney
app.versionCode=1
app.versionName=0.1.0

# ---- 기능 플래그: 한쪽만 꺼도 앱이 동작해야 한다 (qa가 검증) ----
feature.journey.enabled=true
feature.forest.enabled=true
# 지역별 랜드마크 도감(결정 #40, 11/15 제출 목표). 끄면 도감 버튼·축하·도착 판정이 모두 없다
feature.atlas.enabled=true

# ---- 가족 폰 앱(phone/, 결정 #37): 차 앱과 다른 앱 ID. 이 파일 한 곳에서만 정의한다 ----
# phone.displayName = 같이가숲 가족
phone.displayName=\uAC19\uC774\uAC00\uC232 \uAC00\uC871
phone.applicationId=app.familyjourney.phone
phone.versionCode=1
phone.versionName=0.1.0
# 가족 폰 연결(결정 #37). 기본 꺼짐: 꺼져 있으면 차 앱은 지금과 똑같이 동작한다(제출 APK는 꺼짐)
feature.link.enabled=false
# 공유 서버 주소(server/README.md 배포 후). 비어 있으면 플래그를 켜도 연결 기능이 생기지 않는다. 비밀값 아님
sync.serverUrl=
