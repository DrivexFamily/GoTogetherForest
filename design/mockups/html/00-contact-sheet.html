<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>화면 시안 모아 보기</title><style>
@font-face{font-family:"Asta Sans";font-weight:400;src:url("../.font-cache/AstaSans-400.ttf") format("truetype");}@font-face{font-family:"Asta Sans";font-weight:700;src:url("../.font-cache/AstaSans-700.ttf") format("truetype");}@font-face{font-family:"Asta Sans";font-weight:800;src:url("../.font-cache/AstaSans-800.ttf") format("truetype");}
:root{--font:"Asta Sans","NanumSquareRound","Noto Sans CJK KR",sans-serif;}
body{margin:0;background:#E9EEEA;font-family:var(--font);color:#1D2A22;}
.cs{box-sizing:border-box;width:1920px;padding:44px 48px;display:flex;flex-direction:column;gap:28px;}
.cs h1{margin:0;font-size:46px;color:#2B774A;}
.cs p{margin:-14px 0 0;font-size:22px;color:#4B5C51;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 28px;}
figure{margin:0;background:#FFFFFF;border:2px solid #D3E2D4;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.thumb{aspect-ratio:1.62;display:flex;align-items:center;justify-content:center;background:#E9EEEA;border-radius:10px;overflow:hidden;}
.thumb img{max-width:100%;max-height:100%;display:block;}
figcaption{font-size:21px;font-weight:700;line-height:1.35;display:flex;align-items:baseline;gap:6px;}
figcaption span{margin-left:auto;font-size:17px;font-weight:700;color:#4B5C51;white-space:nowrap;}
figcaption b{color:#2B774A;margin-right:6px;}
</style></head><body><div class="cs"><h1>같이가숲 화면 시안 (11/15 기획서·PPT용)</h1>
<p>앱에는 아직 없고 기획서에 시안으로 넣는 화면입니다. 차 화면은 "운전자 정보 | 내비 | 같이가숲" 반 화면 배치, 폰은 웹 화면입니다. 모든 그림은 직접 그렸습니다.</p>
<div class="grid"><figure><div class="thumb"><img src="../png/01-share-web.png" alt=""></div><figcaption><b>01</b> 공유 링크를 받은 가족의 웹 화면<span>기획서 3-B</span></figcaption></figure><figure><div class="thumb"><img src="../png/02-share-consent.png" alt=""></div><figcaption><b>02</b> 위치 공유 동의 화면<span>기획서 3-B</span></figcaption></figure><figure><div class="thumb"><img src="../png/03a-link-qr.png" alt=""></div><figcaption><b>03a</b> 부모 폰 연결 (차 화면 QR)<span>기획서 3-B</span></figcaption></figure><figure><div class="thumb"><img src="../png/03b-link-kid-view.png" alt=""></div><figcaption><b>03b</b> 아이 보기 (뒷좌석 태블릿·부모 폰)<span>기획서 3-B</span></figcaption></figure><figure><div class="thumb"><img src="../png/03c-link-phone-decorate.png" alt=""></div><figcaption><b>03c</b> 폰으로 숲·캐릭터 꾸미기와 기록<span>기획서 3-B · 3-D</span></figcaption></figure><figure><div class="thumb"><img src="../png/04-forest-decorate.png" alt=""></div><figcaption><b>04</b> 숲 꾸미기 (정해진 자리 9곳)<span>기획서 3-D</span></figcaption></figure><figure><div class="thumb"><img src="../png/05-character-decorate.png" alt=""></div><figcaption><b>05</b> 캐릭터 꾸미기 (머리 모양·옷 색·차 색)<span>기획서 3-D</span></figcaption></figure><figure><div class="thumb"><img src="../png/06-group-mode.png" alt=""></div><figcaption><b>06</b> 일행 모드 (여러 차를 한 길에)<span>기획서 3-B · 6</span></figcaption></figure><figure><div class="thumb"><img src="../png/07-points-exchange.png" alt=""></div><figcaption><b>07</b> 보호자 포인트 지갑과 교환<span>기획서 3-C · 6</span></figcaption></figure><figure><div class="thumb"><img src="../png/08a-landmark-pass.png" alt=""></div><figcaption><b>08a</b> 랜드마크를 지나갈 때<span>기획서 3-E</span></figcaption></figure><figure><div class="thumb"><img src="../png/08a-landmark-pass-dark.png" alt=""></div><figcaption><b>08a</b> 랜드마크를 지나갈 때 (다크)<span>기획서 3-E</span></figcaption></figure><figure><div class="thumb"><img src="../png/08b-landmark-book.png" alt=""></div><figcaption><b>08b</b> 랜드마크 도감 넘겨 보기<span>기획서 3-E</span></figcaption></figure></div></div></body></html>
